<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>Educcartito STEAMLab RA - Fullscreen</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-enter-vr-button,
    .a-enter-ar-button,
    .a-orientation-modal {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at top, #263cff 0%, #07122d 45%, #000 100%);
      color: white;
      padding: 24px;
      box-sizing: border-box;
    }

    #cajaInicio {
      width: min(92vw, 480px);
      padding: 28px 22px;
      border-radius: 28px;
      background: rgba(0,0,0,0.55);
      border: 1px solid rgba(255,255,255,0.24);
      box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    }

    #cajaInicio h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
      line-height: 1.15;
    }

    #cajaInicio p {
      margin: 10px 0;
      font-size: 17px;
      line-height: 1.45;
    }

    #version {
      margin-top: 10px;
      font-size: 13px;
      color: #ffeb3b;
    }

    .boton {
      margin-top: 18px;
      padding: 15px 22px;
      border: none;
      border-radius: 999px;
      background: #ffeb3b;
      color: #111;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0,0,0,0.36);
    }

    #mensaje {
      position: fixed;
      z-index: 999997;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(92vw, 600px);
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(0,0,0,0.76);
      color: white;
      font-size: 17px;
      line-height: 1.35;
      text-align: center;
      box-sizing: border-box;
    }

    /*
      Pantalla final del video.
      Esta pantalla tapa completamente la cámara y el canvas de AR.
      Así evitamos el problema de “se escucha, pero no se ve”.
    */
    #pantallaVideo {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: none;
      background: #000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 14px;
      box-sizing: border-box;
    }

    #videoEduccartito {
      width: min(96vw, 960px);
      max-height: 72vh;
      height: auto;
      display: block;
      background: #000;
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0,0,0,0.8);
    }

    #textoVideo {
      color: white;
      text-align: center;
      font-size: 18px;
      line-height: 1.35;
      margin-top: 14px;
      padding: 0 10px;
    }

    #barraBotones {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .botonVideo {
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      background: #ffeb3b;
      color: #111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #escenaAR {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }
  </style>

  <script>
    /*
      EDUCCARTITO AR - VERSIÓN FULLSCREEN V3

      Esta versión NO usa el video como textura WebGL.
      MindAR solo reconoce la tarjeta.
      Cuando la reconoce, se oculta la cámara y se muestra el video grande en pantalla negra.

      Archivos necesarios:
      - index.html
      - targets.mind
      - educcartito-bailando.mp4
    */

    AFRAME.registerComponent("detector-educcartito", {
      init: function () {
        const escenaAR = document.querySelector("#escenaAR");
        const mensaje = document.querySelector("#mensaje");
        const pantallaVideo = document.querySelector("#pantallaVideo");
        const video = document.querySelector("#videoEduccartito");

        this.el.addEventListener("targetFound", async () => {
          mensaje.style.display = "none";
          pantallaVideo.style.display = "flex";

          /*
            Ocultamos la escena AR para que no tape el video.
            Esto soluciona el problema de pantalla negra con audio.
          */
          escenaAR.style.display = "none";

          try {
            video.currentTime = 0;
            video.muted = false;
            await video.play();
          } catch (error) {
            video.muted = true;
            await video.play();
          }
        });
      }
    });

    window.addEventListener("load", () => {
      const inicio = document.querySelector("#inicio");
      const botonInicio = document.querySelector("#botonInicio");
      const botonReproducir = document.querySelector("#botonReproducir");
      const botonVolver = document.querySelector("#botonVolver");
      const escenaAR = document.querySelector("#escenaAR");
      const mensaje = document.querySelector("#mensaje");
      const pantallaVideo = document.querySelector("#pantallaVideo");
      const video = document.querySelector("#videoEduccartito");

      botonInicio.addEventListener("click", async () => {
        inicio.style.display = "none";
        mensaje.innerHTML = "Acepta la cámara y apunta hacia la tarjeta de Educcartito.";

        /*
          Desbloqueo inicial del video en Android/iPhone.
          Lo reproducimos en silencio un instante y lo pausamos.
        */
        try {
          video.muted = true;
          video.load();
          await video.play();
          video.pause();
          video.currentTime = 0;
          video.muted = false;
        } catch (e) {
          console.log("El video se activará cuando se detecte la tarjeta.");
        }
      });

      botonReproducir.addEventListener("click", async () => {
        try {
          video.muted = false;
          await video.play();
        } catch (e) {
          video.muted = true;
          await video.play();
        }
      });

      botonVolver.addEventListener("click", () => {
        video.pause();
        pantallaVideo.style.display = "none";
        escenaAR.style.display = "block";
        mensaje.style.display = "block";
        mensaje.innerHTML = "Apunta nuevamente hacia la tarjeta de Educcartito.";
      });

      video.addEventListener("error", () => {
        alert("No se pudo cargar el video. Revisa que el archivo se llame exactamente educcartito-bailando.mp4.");
      });
    });
  </script>
</head>

<body>

  <div id="inicio">
    <div id="cajaInicio">
      <h1>Educcartito cobra vida</h1>
      <p>Experiencia de Realidad Aumentada STEAMLab.</p>
      <p>Presiona el botón, acepta la cámara y apunta hacia la tarjeta de Educcartito.</p>
      <button id="botonInicio" class="boton">Iniciar experiencia AR</button>
      <div id="version">Versión Fullscreen V3</div>
    </div>
  </div>

  <div id="mensaje">Preparando la experiencia de realidad aumentada...</div>

  <div id="pantallaVideo">
    <video
      id="videoEduccartito"
      src="./educcartito-bailando.mp4"
      preload="auto"
      loop
      controls
      playsinline
      webkit-playsinline>
    </video>

    <div id="textoVideo">
      ¡Educcartito apareció!<br>
      Baila, aprende y descubre patrones.
    </div>

    <div id="barraBotones">
      <button id="botonReproducir" class="botonVideo">Reproducir / sonido</button>
      <button id="botonVolver" class="botonVideo">Volver a escanear</button>
    </div>
  </div>

  <a-scene
    id="escenaAR"
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false; alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" detector-educcartito>
      <a-plane position="0 0 0" width="0.01" height="0.01" visible="false"></a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
