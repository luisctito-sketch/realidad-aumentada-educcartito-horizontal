<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

  <title>Educcartito STEAMLab RA Horizontal</title>

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Fuerza la escena AR a ocupar toda la pantalla del celular */
    a-scene,
    a-scene canvas,
    .a-canvas {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 1 !important;
    }

    .a-enter-vr,
    .a-enter-ar,
    .a-enter-vr-button,
    .a-enter-ar-button,
    .a-orientation-modal {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #inicio {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at top, #1d3cff 0%, #08122c 48%, #000000 100%);
      color: white;
      padding: 24px;
      box-sizing: border-box;
    }

    #cajaInicio {
      width: min(92vw, 480px);
      padding: 28px 22px;
      border-radius: 28px;
      background: rgba(0,0,0,0.52);
      border: 1px solid rgba(255,255,255,0.22);
      box-shadow: 0 14px 36px rgba(0,0,0,0.45);
    }

    #cajaInicio h1 {
      margin: 0 0 12px 0;
      font-size: 30px;
      line-height: 1.15;
    }

    #cajaInicio p {
      margin: 10px 0;
      font-size: 17px;
      line-height: 1.45;
    }

    .boton {
      margin-top: 18px;
      padding: 15px 22px;
      border: none;
      border-radius: 999px;
      background: #ffeb3b;
      color: #111;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0,0,0,0.36);
    }

    #sonido {
      position: fixed;
      z-index: 9998;
      top: 18px;
      right: 18px;
      display: none;
      padding: 12px 18px;
      border: none;
      border-radius: 999px;
      background: #ffeb3b;
      color: #111;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0,0,0,0.36);
    }

    #mensaje {
      position: fixed;
      z-index: 9997;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      width: min(92vw, 600px);
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(0,0,0,0.72);
      color: white;
      font-size: 17px;
      line-height: 1.35;
      text-align: center;
      box-sizing: border-box;
    }

    /*
      Video como capa HTML.
      Esta versión evita el problema de “se oye, pero no se ve”,
      porque NO usa el video como textura de A-Frame.
    */
    #capaVideo {
      position: fixed;
      z-index: 9996;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(94vw, 760px);
      display: none;
      padding: 8px;
      border-radius: 22px;
      background: rgba(0,0,0,0.88);
      box-shadow: 0 18px 45px rgba(0,0,0,0.65);
      box-sizing: border-box;
    }

    #videoEduccartito {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
      background: black;
    }

    #etiquetaVideo {
      color: white;
      font-size: 14px;
      line-height: 1.25;
      text-align: center;
      padding: 8px 6px 2px 6px;
    }
  </style>

  <script>
    /*
      VERSIÓN ESTABLE HORIZONTAL

      Archivos obligatorios:
      - index.html
      - targets.mind
      - educcartito-bailando.mp4

      Esta versión usa MindAR solo para reconocer la imagen.
      Cuando reconoce la tarjeta, muestra el video como capa HTML grande.
      Es mucho más estable en celulares porque evita fallas de textura WebGL.
    */

    AFRAME.registerComponent("detector-educcartito", {
      init: function () {
        const video = document.querySelector("#videoEduccartito");
        const capaVideo = document.querySelector("#capaVideo");
        const mensaje = document.querySelector("#mensaje");

        this.el.addEventListener("targetFound", async () => {
          capaVideo.style.display = "block";
          mensaje.innerHTML = "¡Educcartito apareció!<br>Baila, aprende y descubre patrones.";

          try {
            video.currentTime = 0;
            video.muted = false;
            await video.play();
          } catch (error) {
            mensaje.innerHTML = "Educcartito apareció.<br>Toca “Activar sonido” para iniciar el baile.";
          }
        });

        this.el.addEventListener("targetLost", () => {
          video.pause();
          capaVideo.style.display = "none";
          mensaje.innerHTML = "Busca nuevamente la tarjeta de Educcartito.";
        });
      }
    });

    window.addEventListener("load", () => {
      const inicio = document.querySelector("#inicio");
      const botonInicio = document.querySelector("#botonInicio");
      const botonSonido = document.querySelector("#sonido");
      const mensaje = document.querySelector("#mensaje");
      const video = document.querySelector("#videoEduccartito");
      const capaVideo = document.querySelector("#capaVideo");

      botonInicio.addEventListener("click", async () => {
        inicio.style.display = "none";
        botonSonido.style.display = "block";
        mensaje.innerHTML = "Acepta la cámara y apunta hacia la tarjeta de Educcartito.";

        try {
          video.muted = true;
          video.load();
          await video.play();
          video.pause();
          video.currentTime = 0;
          video.muted = false;
        } catch (e) {
          console.log("El video se activará al detectar la imagen.");
        }
      });

      botonSonido.addEventListener("click", async () => {
        try {
          capaVideo.style.display = "block";
          video.muted = false;
          await video.play();
          mensaje.innerHTML = "Sonido activado.<br>Apunta hacia la tarjeta de Educcartito.";
        } catch (e) {
          mensaje.innerHTML = "Toca nuevamente el botón o revisa el permiso del navegador.";
        }
      });

      video.addEventListener("error", () => {
        mensaje.innerHTML = "No se cargó el video.<br>Revisa que el archivo se llame exactamente educcartito-bailando.mp4.";
      });
    });
  </script>
</head>

<body>

  <div id="inicio">
    <div id="cajaInicio">
      <h1>Educcartito cobra vida</h1>
      <p>Experiencia de Realidad Aumentada STEAMLab.</p>
      <p>Presiona el botón, acepta el permiso de cámara y apunta hacia la tarjeta de Educcartito.</p>
      <button id="botonInicio" class="boton">Iniciar experiencia AR</button>
    </div>
  </div>

  <button id="sonido">Activar sonido</button>

  <div id="mensaje">Preparando la experiencia de realidad aumentada...</div>

  <!-- Video visible como capa HTML, horizontal y grande -->
  <div id="capaVideo">
    <video
      id="videoEduccartito"
      src="./educcartito-bailando.mp4"
      preload="auto"
      loop
      muted
      playsinline
      webkit-playsinline>
    </video>
    <div id="etiquetaVideo">Educcartito STEAMLab en Realidad Aumentada</div>
  </div>

  <!-- Escena MindAR solo para detectar la imagen marcador -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: false; alpha: true; antialias: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" detector-educcartito>
      <!-- Objeto invisible. Solo sirve para activar targetFound y targetLost. -->
      <a-plane
        position="0 0 0"
        width="0.01"
        height="0.01"
        visible="false">
      </a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
